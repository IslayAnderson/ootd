# Self-hosting OOTD with Docker. Copy .env.docker.example to .env.docker, fill it in, then:
#   docker compose --env-file .env.docker up -d
# The site listens on port 8080; put it behind a reverse proxy that handles HTTPS (see docs/SELF-HOSTING.md).
services:
  web:
    build: .
    image: ootd:latest
    env_file: .env.docker
    environment:
      OOTD_ROLE: web
      DB_HOST: db
    ports:
      - "8080:80"
    volumes:
      - media:/var/www/html/storage
    depends_on:
      - db
    restart: unless-stopped

  worker:
    image: ootd:latest
    env_file: .env.docker
    environment:
      OOTD_ROLE: worker
      DB_HOST: db
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php bin/worker.php"]
    volumes:
      - media:/var/www/html/storage
    depends_on:
      - web
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_SCHEMA:-ootd}
      MARIADB_USER: ${DB_USER:-ootd}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env.docker or the shell}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    env_file: .env.docker
    volumes:
      - db:/var/lib/mysql
    restart: unless-stopped

volumes:
  media:
  db:
